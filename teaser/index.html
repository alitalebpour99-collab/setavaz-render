<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setareh Code: Reel teaser</title>
<style>
  @font-face { font-family: 'Garamond'; src: url('shared/assets/EBGaramond-Variable.ttf'); font-weight: 400 800; }
  @font-face { font-family: 'Vazir'; src: url('shared/assets/Vazirmatn-Variable.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'InterD'; src: url('shared/assets/InterDisplay-SemiBold.ttf'); font-weight: 600; }
  html, body { margin: 0; background: #120E3F; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #120E3F; }
  #stage > * { position: absolute; }
  canvas { left: 0; top: 0; }
  .plate { display: none; }
  #mark { left: 50%; top: 150px; width: 150px; margin-left: -75px; opacity: 0.9; }
  #title { left: 0; right: 0; top: 1225px; text-align: center; color: #F6ECD3; font-family: 'Garamond'; font-weight: 500; font-size: 112px; letter-spacing: 0.06em; }
  #title span { display: inline-block; }
  #fa { left: 0; right: 0; top: 1385px; text-align: center; direction: rtl; color: #F4C35A; font-family: 'Vazir'; font-weight: 500; font-size: 56px; }
  #badge { left: 72px; top: 1610px; padding: 16px 30px 16px 22px; border-radius: 60px; background: rgba(18,14,63,0.62); border: 1.5px solid rgba(244,195,90,0.55); color: #F6ECD3; font-family: 'InterD'; font-size: 34px; display: flex; align-items: center; gap: 14px; }
  #badge img { width: 44px; }
  #badge .h { color: #F4C35A; }
  #end { left: 0; top: 0; width: 1080px; height: 1920px; background: rgba(12,9,44,0.88); }
  #end img { position: absolute; left: 50%; top: 600px; width: 640px; margin-left: -320px; }
  #end .fa { position: absolute; left: 0; right: 0; top: 1180px; text-align: center; direction: rtl; color: #F6ECD3; font-family: 'Vazir'; font-weight: 600; font-size: 64px; }
  #end .en { position: absolute; left: 0; right: 0; top: 1290px; text-align: center; color: #F4C35A; font-family: 'Garamond'; font-weight: 500; font-size: 44px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div id="stage" data-composition-id="teaser" data-start="0" data-duration="24" data-width="1080" data-height="1920" data-fps="30">
  <canvas id="cv" class="clip" width="1080" height="1920" data-start="0" data-duration="24" data-track-index="0"></canvas>
  <img id="plate" class="plate" src="shared/assets/plate-916.jpg" alt="">
  <img id="mark" class="clip" src="shared/assets/mark.svg" alt="Setavaz" data-start="0" data-duration="24" data-track-index="1">
  <div id="title" class="clip" data-start="0" data-duration="24" data-track-index="2"></div>
  <div id="fa" class="clip" data-start="0" data-duration="24" data-track-index="3">رمزِ ستاره</div>
  <div id="badge" class="clip" data-start="0" data-duration="24" data-track-index="4"><img src="shared/assets/mark.svg" alt="">Setavaz <span class="h">&#9829;</span> follow</div>
  <div id="end" class="clip" data-start="0" data-duration="24" data-track-index="5">
    <img src="shared/assets/lockup.svg" alt="Setavaz">
    <div class="fa">نسخهٔ کامل در یوتیوب و اسپاتیفای</div>
    <div class="en">Full track on YouTube &amp; Spotify</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="data.js"></script>
  <script src="shared/scene.js"></script>
  <script>
    // 0-8 s: the last 4 bars of the second build; 8 s: the second drop (the peak); 20-24 s: the end card.
    const DROP = 8, END = 20, DUR = 24
    const title = document.getElementById('title')
    title.innerHTML = 'SETAREH CODE'.split('').map((c) => `<span>${c === ' ' ? '&nbsp;' : c}</span>`).join('')
    const tl = gsap.timeline({ paused: true })
    window.svBind(tl, document.getElementById('cv'), document.getElementById('plate'), {
      duration: DUR, starY: 0.4, starR: 0.36, stars: 380, buildFrom: 0.12,
      sections: [{ name: 'build', kind: 'build', start: 0, end: DROP }, { name: 'drop', kind: 'drop', start: DROP, end: DUR }],
    })
    tl.fromTo('#mark', { opacity: 0.9 }, { opacity: 0, duration: 0.6 }, END - 0.6)
    tl.fromTo('#title span', { opacity: 0, y: 60, filter: 'blur(14px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.5, stagger: 0.045, ease: 'power3.out' }, DROP + 0.15)
    tl.fromTo('#fa', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, DROP + 0.9)
    tl.to('#title, #fa', { opacity: 0, duration: 0.5 }, END - 0.7)
    tl.fromTo('#badge', { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: 'back.out(1.6)' }, 14)
    tl.to('#badge', { opacity: 0, duration: 0.35 }, END - 0.9)
    tl.fromTo('#end', { opacity: 0 }, { opacity: 1, duration: 0.7, ease: 'power2.out' }, END)
    tl.fromTo('#end img', { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.9, ease: 'power3.out' }, END + 0.15)
    tl.fromTo('#end .fa, #end .en', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.18, ease: 'power2.out' }, END + 0.6)
    tl.set({}, {}, DUR)
    window.__timelines = window.__timelines || {}
    window.__timelines.teaser = tl
  </script>
</div>
</body>
</html>
