name: Render r3 Shorts
# Setavaz round-3 Shorts (r3/): one lit 3D world per track, rendered SILENT on GitHub's runners (this repo is public,
# so the minutes are free). The Setavaz panel's «ساخت ویدیو» dispatches `what = r3` for one track with the input `job`
# (gzip, then base64; made by the app's lib/r3job.ts): the track's name, tempo and world, and the window's sound as
# numbers only (onsets and loudness per frame), measured on the app's own server. The music never enters this repo or
# this run: the app reads the artifact (the silent picture, its cover frame, its report), puts the track under it on
# its server and checks the loudness there. The panel finds its run by this title, so the title names the track.
# A pull request renders only the cheap look (turntables and key frames, from the test jobs r3/jobs/*.json).
# A long video (what = r3-long: 16:9, the whole track) is drawn in parts of about 20 seconds, one runner each
# (matrix), then join.mjs puts the parts together and gates the whole: still one run per video.
# Nothing is posted or scheduled. Artifacts are kept 3 days.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Render {0} {1}', inputs.what, inputs.tracks) || github.event.pull_request.title }}
on:
  pull_request:
    paths: ['r3/**', '.github/workflows/r3.yml']
  workflow_dispatch:
    inputs:
      what: { description: 'r3 (one full Short from the job), r3-long (one long video from the job), r3-stills (turntables and key frames of the test jobs), girih-stills or girih-render (round 1126, tracks = a JSON list of r3/jobs/girih/<name>)', required: true, default: 'r3-stills' }
      tracks: { description: 'r3: the track, as a JSON list of one (names the run)', required: false, default: '[]' }
      job: { description: 'r3: the job from the Setavaz app (gzip, then base64). Numbers only, no sound.', required: false, default: '' }
permissions:
  contents: read
concurrency:
  group: r3-${{ github.ref }}-${{ inputs.what || 'pr' }}-${{ inputs.tracks || '' }}
  cancel-in-progress: true
jobs:
  stills:
    if: github.event_name == 'pull_request' || inputs.what == 'r3-stills'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: r3 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null && ffmpeg -version | head -1 && google-chrome --version
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Turntable of every library object
        run: node render.mjs --turntables --out out
      - name: Key frames of each Short
        run: |
          for f in jobs/*.json; do
            node render.mjs --job "$f" --stills --out out
          done
      - name: Keep the files
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: r3-stills, path: r3/out/, retention-days: 3 }
  r3:
    if: github.event_name == 'workflow_dispatch' && inputs.what == 'r3'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults: { run: { working-directory: r3 } }
    steps:
      - uses: actions/checkout@v4
      - name: The job
        id: job
        # read from the event file, not from an env var, so the long input is never printed in the log
        run: |
          jq -r '.inputs.job // ""' "$GITHUB_EVENT_PATH" > job.b64
          test -s job.b64 || { echo "no job: the Setavaz panel sends one with each dispatch"; exit 1; }
          TRACK=$(base64 -d job.b64 | gunzip | jq -r '.trackId')
          echo "$TRACK" | grep -Eq '^[a-z0-9-]{1,60}$' || { echo "the job names no track"; exit 1; }
          jq -r '.inputs.tracks // ""' "$GITHUB_EVENT_PATH" | grep -Fq "\"$TRACK\"" || { echo "the job is for $TRACK, the title names another track"; exit 1; }
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "job for $TRACK: $(wc -c < job.b64) characters"
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null && ffmpeg -version | head -1 && google-chrome --version
      - run: npm ci --no-audit --no-fund
      - name: Render (silent picture) and gate
        run: node render.mjs --job job.b64 --out out
      - name: Keep the files
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'r3-${{ steps.job.outputs.track }}', path: r3/out/, retention-days: 3 }
  long-plan:
    if: github.event_name == 'workflow_dispatch' && inputs.what == 'r3-long'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: r3 } }
    outputs:
      track: ${{ steps.job.outputs.track }}
      parts: ${{ steps.job.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: The job and its parts
        id: job
        run: |
          jq -r '.inputs.job // ""' "$GITHUB_EVENT_PATH" > job.b64
          test -s job.b64 || { echo "no job"; exit 1; }
          TRACK=$(base64 -d job.b64 | gunzip | jq -r '.trackId')
          echo "$TRACK" | grep -Eq '^[a-z0-9-]{1,60}$' || { echo "the job names no track"; exit 1; }
          jq -r '.inputs.tracks // ""' "$GITHUB_EVENT_PATH" | grep -Fq "\"$TRACK\"" || { echo "the job is for $TRACK, the title names another track"; exit 1; }
          PARTS=$(node -e "import('./plan.mjs').then(m => { const p = m.makeR3Plan({ job: m.readJob('job.b64') }); if (p.format !== 'long') throw new Error('not a long video'); console.log(JSON.stringify([...Array(m.partsOf(p)).keys()])); })")
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "parts=$PARTS" >> "$GITHUB_OUTPUT"
          echo "long video $TRACK in parts $PARTS"
  long-part:
    needs: long-plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        part: ${{ fromJson(needs.long-plan.outputs.parts) }}
    defaults: { run: { working-directory: r3 } }
    steps:
      - uses: actions/checkout@v4
      - run: jq -r '.inputs.job // ""' "$GITHUB_EVENT_PATH" > job.b64
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null && ffmpeg -version | head -1 && google-chrome --version
      - run: npm ci --no-audit --no-fund
      - name: Render part ${{ matrix.part }} (silent)
        run: node render.mjs --job job.b64 --part ${{ matrix.part }} --out out
      - uses: actions/upload-artifact@v4
        with: { name: 'part-${{ matrix.part }}', path: r3/out/, retention-days: 1 }
  long-join:
    needs: [long-plan, long-part]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: r3 } }
    steps:
      - uses: actions/checkout@v4
      - run: jq -r '.inputs.job // ""' "$GITHUB_EVENT_PATH" > job.b64
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null && ffmpeg -version | head -1
      - uses: actions/download-artifact@v4
        with: { pattern: 'part-*', path: r3/parts }
      - name: Join the parts and gate the whole
        run: node join.mjs --job job.b64 --in parts --out out
      - name: Keep the files
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'r3-${{ needs.long-plan.outputs.track }}', path: r3/out/, retention-days: 3 }
  # ── round 1126: the girih videos, MANY in one run (what = girih-stills | girih-render, tracks = a JSON list of
  # r3/jobs/girih/<name>). Each job is numbers only (no sound). Shorts and loops one runner each; a long video in parts
  # of about 20 s, then joined and gated. The picture is SILENT; the sound is put under it in a private repo. ──
  g-plan:
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.what, 'girih-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: r3 } }
    outputs:
      units: ${{ steps.p.outputs.units }}
      longs: ${{ steps.p.outputs.longs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: The units of work
        id: p
        env: { WHAT: '${{ inputs.what }}', NAMES: '${{ inputs.tracks }}' }
        run: |
          node --input-type=module -e "
          const m = await import('./plan.mjs');
          const names = JSON.parse(process.env.NAMES), what = process.env.WHAT.replace('girih-', '');
          if (!['stills', 'render'].includes(what)) throw new Error('what = stills or render');
          const units = [], longs = [];
          for (const name of names) {
            if (!/^[a-z0-9-]{1,60}$/.test(name)) throw new Error('bad name ' + name);
            const plan = m.makeR3Plan({ job: m.readJob('jobs/girih/' + name + '.json') });
            if (what === 'render' && plan.format === 'long') { longs.push(name); for (let k = 0; k < m.partsOf(plan); k++) units.push({ name, part: k }); }
            else units.push({ name, part: -1 });
          }
          const fs = await import('node:fs');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'units=' + JSON.stringify(units) + '\nlongs=' + JSON.stringify(longs) + '\n');
          console.log(units.length, 'units;', longs.length, 'long videos');
          "
  g-unit:
    needs: g-plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.g-plan.outputs.units) }}
    defaults: { run: { working-directory: r3 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null && ffmpeg -version | head -1 && google-chrome --version
      - run: npm ci --no-audit --no-fund
      - name: ${{ inputs.what }} ${{ matrix.name }} ${{ matrix.part }}
        run: |
          J=jobs/girih/${{ matrix.name }}.json
          if [ "${{ inputs.what }}" = "girih-stills" ]; then node render.mjs --job "$J" --stills --out out
          elif [ "${{ matrix.part }}" -ge 0 ]; then node render.mjs --job "$J" --part ${{ matrix.part }} --out out
          else node render.mjs --job "$J" --out out; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.what == 'girih-stills' && format('stills-{0}', matrix.name) || (matrix.part >= 0 && format('part-{0}-{1}', matrix.name, matrix.part) || format('r3-{0}', matrix.name)) }}
          path: r3/out/
          retention-days: ${{ matrix.part >= 0 && 1 || 3 }}
  g-join:
    needs: [g-plan, g-unit]
    if: always() && inputs.what == 'girih-render' && needs.g-plan.outputs.longs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJson(needs.g-plan.outputs.longs) }}
    defaults: { run: { working-directory: r3 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null && ffmpeg -version | head -1
      - uses: actions/download-artifact@v4
        with: { pattern: 'part-${{ matrix.name }}-*', path: r3/parts }
      - name: Join the parts and gate the whole
        run: node join.mjs --job jobs/girih/${{ matrix.name }}.json --in parts --out out
      - name: Keep the files
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'r3-${{ matrix.name }}', path: r3/out/, retention-days: 3 }
