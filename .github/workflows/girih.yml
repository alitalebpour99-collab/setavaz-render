name: Render girih (round 1126)
# The round-1126 Setavaz videos (the gold girih over a real photograph, r3/page/scenes/girih.mjs), MANY in one run:
# `names` is a JSON list of r3/jobs/girih/<name> (each job is numbers only: onsets, loudness and the geometry bands per
# frame; no sound). what = stills: the key frames of each (a quick look before the full renders). what = render: each
# Short or loop on its own runner; each long video in parts of about 20 s (one runner each), then joined and gated.
# The picture is SILENT: the music never enters this public repo. The sound is put under it in a private repo.
# Nothing is posted or scheduled. Artifacts are kept 3 days (parts 1 day).
run-name: Girih ${{ inputs.what }} ${{ inputs.names }}
on:
  workflow_dispatch:
    inputs:
      what: { description: 'stills or render', required: true, default: 'stills' }
      names: { description: 'JSON list of r3/jobs/girih/<name> (without .json)', required: true, default: '["mehr-loop"]' }
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: r3 } }
    outputs:
      units: ${{ steps.p.outputs.units }}
      longs: ${{ steps.p.outputs.longs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: The units of work
        id: p
        env: { WHAT: '${{ inputs.what }}', NAMES: '${{ inputs.names }}' }
        run: |
          node --input-type=module -e "
          const m = await import('./plan.mjs');
          const names = JSON.parse(process.env.NAMES), what = process.env.WHAT;
          if (!['stills', 'render'].includes(what)) throw new Error('what = stills or render');
          const units = [], longs = [];
          for (const name of names) {
            if (!/^[a-z0-9-]{1,60}$/.test(name)) throw new Error('bad name ' + name);
            const plan = m.makeR3Plan({ job: m.readJob('jobs/girih/' + name + '.json') });
            if (what === 'render' && plan.format === 'long') { longs.push(name); for (let k = 0; k < m.partsOf(plan); k++) units.push({ name, part: k }); }
            else units.push({ name, part: -1 });
          }
          const fs = await import('node:fs');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'units=' + JSON.stringify(units) + '\nlongs=' + JSON.stringify(longs) + '\n');
          console.log(units.length, 'units;', longs.length, 'long videos');
          "
  unit:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.plan.outputs.units) }}
    defaults: { run: { working-directory: r3 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null && ffmpeg -version | head -1 && google-chrome --version
      - run: npm ci --no-audit --no-fund
      - name: ${{ inputs.what }} ${{ matrix.name }} ${{ matrix.part }}
        run: |
          J=jobs/girih/${{ matrix.name }}.json
          if [ "${{ inputs.what }}" = "stills" ]; then node render.mjs --job "$J" --stills --out out
          elif [ "${{ matrix.part }}" -ge 0 ]; then node render.mjs --job "$J" --part ${{ matrix.part }} --out out
          else node render.mjs --job "$J" --out out; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.what == 'stills' && format('stills-{0}', matrix.name) || (matrix.part >= 0 && format('part-{0}-{1}', matrix.name, matrix.part) || format('r3-{0}', matrix.name)) }}
          path: r3/out/
          retention-days: ${{ matrix.part >= 0 && 1 || 3 }}
  join:
    needs: [plan, unit]
    if: always() && inputs.what == 'render' && needs.plan.outputs.longs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJson(needs.plan.outputs.longs) }}
    defaults: { run: { working-directory: r3 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null && ffmpeg -version | head -1
      - uses: actions/download-artifact@v4
        with: { pattern: 'part-${{ matrix.name }}-*', path: r3/parts }
      - name: Join the parts and gate the whole
        run: node join.mjs --job jobs/girih/${{ matrix.name }}.json --in parts --out out
      - name: Keep the files
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'r3-${{ matrix.name }}', path: r3/out/, retention-days: 3 }
